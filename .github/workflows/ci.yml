name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assetflow
          POSTGRES_PASSWORD: assetflow
          POSTGRES_DB: assetflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetflow -d assetflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://assetflow:assetflow@localhost:5432/assetflow?schema=public
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Backend verify (typecheck + migrate + test)
        working-directory: backend
        run: npm run verify

      - name: Frontend production build
        run: npm run build --workspace=frontend
